name: JANUS Credentialless Packet Roundtrip

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/janus_spi/mailbox_roundtrip.py'
      - 'run_janus_credentialless_roundtrip.py'
      - 'tests/test_mailbox_roundtrip.py'
      - '.janus/activator/CREDENTIALLESS_ROUNDTRIP_ARM.json'
      - '.github/workflows/janus-credentialless-roundtrip.yml'
  push:
    branches: [main]
    paths:
      - '.janus/activator/CREDENTIALLESS_ROUNDTRIP_ARM.json'
      - '.github/workflows/janus-credentialless-roundtrip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile bounded roundtrip path
        run: |
          python -m compileall -q \
            src/janus_spi/mailbox_roundtrip.py \
            run_janus_credentialless_roundtrip.py \
            tests/test_mailbox_roundtrip.py
      - name: Validate frozen arm
        run: |
          python -m json.tool .janus/activator/CREDENTIALLESS_ROUNDTRIP_ARM.json >/dev/null
          python - <<'PY'
          import json
          arm=json.load(open('.janus/activator/CREDENTIALLESS_ROUNDTRIP_ARM.json'))
          assert arm['armed'] is True
          assert arm['purpose'] == 'FIRST_REAL_DUAL_LANE_PACKET_ROUNDTRIP'
          assert arm['target_repository'] == 'Hawkar-usls/Janus-Demiurge'
          assert arm['required_lanes_attempted'] == ['SECRET_PUSH','CREDENTIALLESS_PULL']
          assert arm['required_credentialless_result'] == 'DELIVERY_ACK_ONLY'
          assert arm['target_execution_authorized'] is False
          assert arm['target_execution_expected'] is False
          assert arm['is_launch_witness'] is False
          for field in (
              'command_authority_granted','claim_authority_granted',
              'scientific_evidence_authority_granted','world_truth_authority_granted',
              'external_effect_authorized','physical_runtime_effect_authorized',
          ):
              assert arm[field] is False
          print('CREDENTIALLESS_ROUNDTRIP_ARM=PASS')
          PY
      - name: Run local bounded roundtrip contracts
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_mailbox_roundtrip.py tests/test_mailbox_transport.py tests/test_dual_transport.py

  roundtrip:
    if: github.event_name != 'pull_request'
    needs: contract
    concurrency:
      group: janus-credentialless-roundtrip-witness
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out canonical HOME
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: pip install -r requirements.txt

      - name: Materialize unique bounded transport stimulus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/credentialless-roundtrip
          python - <<'PY'
          import json, os
          arm=json.load(open('.janus/activator/CREDENTIALLESS_ROUNDTRIP_ARM.json'))
          payload={
              'purpose': arm['purpose'],
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'home_sha': os.environ['GITHUB_SHA'],
              'target_repository': arm['target_repository'],
              'target_execution_expected': False,
              'is_launch_witness': False,
          }
          json.dump(payload, open('runtime/credentialless-roundtrip/payload.json','w'), indent=2, sort_keys=True)
          PY

      - name: Attempt both transport lanes and wait for credentialless ACK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JANUS_DEMIURGE_DISPATCH_TOKEN: ${{ secrets.JANUS_DEMIURGE_DISPATCH_TOKEN }}
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python run_janus_credentialless_roundtrip.py \
            --source-ref "CREDENTIALLESS_ROUNDTRIP/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --payload-file runtime/credentialless-roundtrip/payload.json \
            --state-dir runtime/credentialless-roundtrip/state \
            --poll-interval 10 \
            --max-wait 660 \
            --output runtime/credentialless-roundtrip/result.json \
            --require-complete

      - name: Adjudicate bounded non-launch witness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f runtime/credentialless-roundtrip/result.json ]; then
            echo 'ROUNDTRIP_RESULT_MISSING=TRUE'
            exit 1
          fi
          python - <<'PY'
          import json
          r=json.load(open('runtime/credentialless-roundtrip/result.json'))
          required = {
              'terminal': 'CREDENTIALLESS_PACKET_ROUNDTRIP_OBSERVED_NON_IDENTITY_PROVENANCE',
              'credentialless_ack_observed': True,
              'credentialless_identity_proof': False,
              'target_execution_observed': False,
              'command_authority_granted': False,
              'claim_authority_granted': False,
              'scientific_evidence_authority_granted': False,
              'world_truth_authority_granted': False,
              'external_effect_authorized': False,
              'physical_runtime_effect_authorized': False,
          }
          for key, value in required.items():
              assert r.get(key) == value, (key, r.get(key), value)
          assert r.get('credentialless_lane_emitted') is True
          assert r.get('mailbox_message_hash')
          assert r.get('mailbox_response_hash')
          print('JANUS_CREDENTIALLESS_PACKET_ROUNDTRIP=PASS')
          print('STRICT_LAUNCH_WITNESS=FALSE')
          print('CREDENTIALLESS_IDENTITY_PROOF=FALSE')
          PY

      - name: Upload bounded transport witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-credentialless-roundtrip-${{ github.run_id }}
          path: |
            runtime/credentialless-roundtrip/result.json
            runtime/credentialless-roundtrip/payload.json
            runtime/credentialless-roundtrip/state/dual_transport_ledger.jsonl
            runtime/credentialless-roundtrip/state/mailbox_transport_ledger.jsonl
            runtime/credentialless-roundtrip/state/mailbox_outbox/*.json
          if-no-files-found: warn
          retention-days: 14
