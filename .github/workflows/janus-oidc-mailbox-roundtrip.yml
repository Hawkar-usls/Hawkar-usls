name: JANUS OIDC Mailbox Roundtrip

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/janus_spi/oidc_mailbox.py'
      - 'src/janus_spi/oidc_roundtrip.py'
      - 'src/janus_spi/oidc_reconcile.py'
      - 'run_janus_oidc_roundtrip.py'
      - 'run_janus_oidc_reconcile.py'
      - 'tools/janus_secret_persistence_guard.py'
      - 'tests/test_oidc_mailbox.py'
      - 'tests/test_oidc_reconcile.py'
      - '.janus/activator/OIDC_MAILBOX_IDENTITY_CONSTITUTION.json'
      - '.janus/activator/OIDC_ROUNDTRIP_ARM.json'
      - '.github/workflows/janus-oidc-mailbox-roundtrip.yml'
      - '.github/workflows/janus-oidc-mailbox-reconcile.yml'
  push:
    branches: [main]
    paths:
      - 'src/janus_spi/oidc_mailbox.py'
      - 'src/janus_spi/oidc_roundtrip.py'
      - 'src/janus_spi/oidc_reconcile.py'
      - 'run_janus_oidc_roundtrip.py'
      - 'run_janus_oidc_reconcile.py'
      - 'tools/janus_secret_persistence_guard.py'
      - '.janus/activator/OIDC_MAILBOX_IDENTITY_CONSTITUTION.json'
      - '.janus/activator/OIDC_ROUNDTRIP_ARM.json'
      - '.github/workflows/janus-oidc-mailbox-roundtrip.yml'
      - '.github/workflows/janus-oidc-mailbox-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest 'PyJWT[crypto]>=2.10,<3'
      - name: Compile OIDC path and persistence guard
        run: |
          python -m compileall -q \
            src/janus_spi/oidc_mailbox.py \
            src/janus_spi/oidc_roundtrip.py \
            src/janus_spi/oidc_reconcile.py \
            run_janus_oidc_roundtrip.py \
            run_janus_oidc_reconcile.py \
            tools/janus_secret_persistence_guard.py \
            tests/test_oidc_mailbox.py \
            tests/test_oidc_reconcile.py
      - name: Validate frozen OIDC constitution and arm
        run: |
          python -m json.tool .janus/activator/OIDC_MAILBOX_IDENTITY_CONSTITUTION.json >/dev/null
          python -m json.tool .janus/activator/OIDC_ROUNDTRIP_ARM.json >/dev/null
          python - <<'PY'
          import json
          c=json.load(open('.janus/activator/OIDC_MAILBOX_IDENTITY_CONSTITUTION.json'))
          a=json.load(open('.janus/activator/OIDC_ROUNDTRIP_ARM.json'))
          assert c['home_workflow_ref'] == 'Hawkar-usls/Hawkar-usls/.github/workflows/janus-oidc-mailbox-roundtrip.yml@refs/heads/main'
          assert c['target_workflow_ref'] == 'Hawkar-usls/Janus-Demiurge/.github/workflows/janus-activator-credentialless-mailbox.yml@refs/heads/main'
          assert c['stage']['p12_enabled'] is False
          assert a['armed'] is True
          assert a['lanes_attempted'] == ['SECRET_PUSH','OIDC_CREDENTIALLESS_PULL']
          assert a['bidirectional_identity_proof_required'] is True
          assert a['p12_execution_authority_granted'] is False
          assert a['is_launch_witness'] is False
          print('OIDC_CONSTITUTION_AND_ARM=PASS')
          PY
      - name: Run HOME OIDC adversarial tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_oidc_mailbox.py tests/test_oidc_reconcile.py tests/test_dual_transport.py

  roundtrip:
    if: github.event_name != 'pull_request'
    needs: contract
    concurrency:
      group: janus-oidc-mailbox-roundtrip-witness
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out canonical HOME without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and OIDC verifier
        run: |
          pip install -r requirements.txt
          pip install 'PyJWT[crypto]>=2.10,<3'
      - name: Materialize unique non-launch OIDC stimulus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/oidc-roundtrip
          python - <<'PY'
          import json,os
          arm=json.load(open('.janus/activator/OIDC_ROUNDTRIP_ARM.json'))
          payload={
              'purpose':arm['purpose'],
              'github_run_id':os.environ['GITHUB_RUN_ID'],
              'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'home_sha':os.environ['GITHUB_SHA'],
              'target_repository':arm['target_repository'],
              'p12_enabled':False,
              'target_execution_expected':False,
              'is_launch_witness':False,
          }
          json.dump(payload,open('runtime/oidc-roundtrip/payload.json','w'),indent=2,sort_keys=True)
          PY
      - name: Attempt secret lane and security-quarantined OIDC lane
        env:
          JANUS_DEMIURGE_DISPATCH_TOKEN: ${{ secrets.JANUS_DEMIURGE_DISPATCH_TOKEN }}
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python run_janus_oidc_roundtrip.py \
            --source-ref "OIDC_ROUNDTRIP/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --payload-file runtime/oidc-roundtrip/payload.json \
            --state-dir runtime/oidc-roundtrip/state \
            --poll-interval 10 \
            --max-wait 660 \
            --output runtime/oidc-roundtrip/result.json
      - name: Adjudicate verified ACK, pending state, or persistence quarantine
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime/oidc-roundtrip/result.json
          python - <<'PY'
          import json
          r=json.load(open('runtime/oidc-roundtrip/result.json'))
          terminal=r.get('terminal')
          authority_fields=(
              'command_authority_granted','claim_authority_granted',
              'scientific_evidence_authority_granted','world_truth_authority_granted',
              'external_effect_authorized','physical_runtime_effect_authorized',
              'target_execution_observed','p12_execution_authority_granted','is_launch_witness',
          )
          for key in authority_fields:
              assert r.get(key) is False,(key,r.get(key))
          assert r.get('secret_lane_attempted') is True
          assert r.get('oidc_lane_attempted') is True
          if terminal=='OIDC_BIDIRECTIONAL_PACKET_ROUNDTRIP_VERIFIED_NO_EXECUTION':
              assert r.get('oidc_lane_emitted') is True
              assert r.get('oidc_source_identity_verified') is True
              assert r.get('oidc_target_identity_verified') is True
              assert r.get('bidirectional_identity_proof') is True
              assert r.get('oidc_response_hash')
              print('JANUS_OIDC_BIDIRECTIONAL_PACKET_ACK=PASS')
          elif terminal=='OIDC_ROUNDTRIP_ACK_WAIT_UNRESOLVED':
              assert r.get('oidc_lane_emitted') is True
              assert r.get('oidc_source_identity_verified') is True
              assert r.get('oidc_target_identity_verified') is False
              assert r.get('bidirectional_identity_proof') is False
              assert r.get('oidc_response_hash') is None
              assert any('silence is not negative evidence' in str(x).lower() for x in r.get('reasons',[]))
              print('JANUS_OIDC_REQUEST=PUBLISHED_PENDING_TARGET_POLL')
          elif terminal=='OIDC_ROUNDTRIP_BLOCKED_REQUEST_NOT_PUBLISHED_WITH_IDENTITY':
              assert r.get('oidc_lane_emitted') is False
              assert r.get('oidc_source_identity_verified') is False
              assert r.get('oidc_request_message_hash') is None
              assert 'OIDC_MAILBOX_BLOCKED_NO_LOCAL_GITHUB_TOKEN' in [str(x) for x in r.get('reasons',[])]
              print('JANUS_OIDC_RAW_CREDENTIAL_PERSISTENCE=DENIED')
              print('OIDC_CREDENTIALLESS_PULL=SECURITY_QUARANTINED_PENDING_NON_SECRET_ATTESTATION')
          else:
              raise AssertionError(('unexpected OIDC roundtrip terminal',terminal,r.get('reasons')))
          print('P12_EXECUTION_AUTHORITY=FALSE')
          print('STRICT_LAUNCH_WITNESS=FALSE')
          PY
      - name: Upload non-secret roundtrip witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-oidc-roundtrip-${{ github.run_id }}
          path: |
            runtime/oidc-roundtrip/result.json
            runtime/oidc-roundtrip/payload.json
          if-no-files-found: warn
          retention-days: 14
