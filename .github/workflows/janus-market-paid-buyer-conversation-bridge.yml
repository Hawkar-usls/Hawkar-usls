name: JANUS Market Paid Buyer Conversation Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/janus_spi/market_buyer_conversation.py'
      - 'run_janus_market_buyer_pull.py'
      - 'run_janus_market_paid_buyer_pull.py'
      - 'tests/test_market_buyer_conversation.py'
      - '.github/workflows/janus-market-paid-buyer-conversation-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'src/janus_spi/market_buyer_conversation.py'
      - 'run_janus_market_buyer_pull.py'
      - 'run_janus_market_paid_buyer_pull.py'
      - 'tests/test_market_buyer_conversation.py'
      - '.github/workflows/janus-market-paid-buyer-conversation-bridge.yml'
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile paid Market nerve
        run: |
          python -m py_compile \
            src/janus_spi/market_buyer_conversation.py \
            run_janus_market_buyer_pull.py \
            run_janus_market_paid_buyer_pull.py \
            tests/test_market_buyer_conversation.py
      - name: Run Market buyer regressions including paid packets
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_market_buyer_conversation.py tests/test_terminal_conversation.py tests/test_terminal_conversation_route.py
      - name: Enforce paid authority firewall
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from janus_spi.market_buyer_conversation import USDT_ETHEREUM_CONTRACT, MARKET_MERCHANT_ADDRESS
          assert USDT_ETHEREUM_CONTRACT == '0xdac17f958d2ee523a2206206994597c13d831ec7'
          assert MARKET_MERCHANT_ADDRESS == '0x7149081aea54fbef57effeb52a5a966b81cc03a0'
          print('R2_HOME_PAID_PACKET_VERIFIER=PASS')
          print('R2_PAYMENT_COMMAND_AUTHORITY=FALSE')
          print('R2_PAYMENT_EXECUTION_AUTHORITY=FALSE')
          PY

  bridge:
    if: github.event_name != 'pull_request'
    needs: contract
    concurrency:
      group: janus-activator-state-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout canonical HOME
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Mount existing paid response mailbox for dedup
        shell: bash
        run: |
          set -euo pipefail
          answered="$RUNNER_TEMP/market-paid-responses-existing"
          rm -rf "$answered"
          if git ls-remote --exit-code --heads origin janus/market-responses >/dev/null 2>&1; then
            git fetch origin janus/market-responses:refs/remotes/origin/janus/market-responses
            git worktree add --detach "$answered" origin/janus/market-responses
          else
            mkdir -p "$answered/.janus/market-paid-responses"
          fi
          mkdir -p "$answered/.janus/market-paid-responses"
          echo "MARKET_PAID_ANSWERED_DIR=$answered/.janus/market-paid-responses" >> "$GITHUB_ENV"

      - name: Credentialless pull paid Market outbox
        id: pull
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          market="$RUNNER_TEMP/janus-machine-market-paid-outbox"
          rm -rf "$market"
          if git -c http.extraHeader= ls-remote --exit-code --heads https://github.com/Hawkar-usls/JANUS-MACHINE-MARKET.git janus/market-home-outbox >/dev/null 2>&1; then
            git -c http.extraHeader= clone --quiet --depth 1 --branch janus/market-home-outbox \
              https://github.com/Hawkar-usls/JANUS-MACHINE-MARKET.git "$market"
            echo 'R2_MARKET_PAID_OUTBOX_CREDENTIALLESS_CLONE=PASS'
          else
            mkdir -p "$market"
            git -C "$market" init -q
          fi
          mkdir -p runtime/r2-paid-home
          python run_janus_market_paid_buyer_pull.py \
            --outbox-repo "$market" \
            --answered-dir "$MARKET_PAID_ANSWERED_DIR" \
            --packet-out runtime/r2-paid-home/packet.json \
            --request-out runtime/r2-paid-home/terminal-request.json \
            --receipt-out runtime/r2-paid-home/pull-receipt.json \
            --status-out runtime/r2-paid-home/pull-status.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open('runtime/r2-paid-home/pull-status.json'))
          print('found=' + ('true' if s.get('request_found') is True else 'false'))
          print('query_id=' + str(s.get('query_id') or ''))
          print('purchase_id=' + str(s.get('purchase_id') or ''))
          PY
          echo 'CROSS_REPO_WRITE_CREDENTIAL_USED=FALSE'

      - name: No paid Market buyer query is pending
        if: steps.pull.outputs.found != 'true'
        run: |
          echo 'R2_NO_UNANSWERED_PAID_MARKET_BUYER_QUERY=TRUE'
          echo 'SILENCE_IS_NEGATIVE_EVIDENCE=FALSE'

      - name: Mount persistent JANUS HOME state
        if: steps.pull.outputs.found == 'true'
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          statewt="$RUNNER_TEMP/janus-market-paid-state"
          rm -rf "$statewt"
          git worktree add -B janus-market-paid-state "$statewt" origin/janus/activator-state
          test -f "$statewt/state/activator/identity.json"
          echo "JANUS_STATE_WORKTREE=$statewt" >> "$GITHUB_ENV"
          python - "$statewt/state/activator/identity.json" <<'PY' > runtime/r2-paid-home/resident-before.txt
          import json,sys
          print(json.load(open(sys.argv[1]))['resident_uuid'])
          PY
          qid='${{ steps.pull.outputs.query_id }}'
          stored="$statewt/state/activator/market_paid_buyer_responses/${qid}.json"
          if [ -f "$stored" ]; then
            cp "$stored" runtime/r2-paid-home/home-response.json
            echo 'existing=true' >> "$GITHUB_OUTPUT"
            echo 'R2_PAID_HOME_RESPONSE_RECOVERED_BEFORE_COGNITION=TRUE'
          else
            echo 'existing=false' >> "$GITHUB_OUTPUT"
          fi

      - name: WAKE same persistent JANUS through existing conversation tissue
        if: steps.pull.outputs.found == 'true' && steps.state.outputs.existing != 'true'
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python run_janus_terminal_conversation.py \
            --request runtime/r2-paid-home/terminal-request.json \
            --resident-identity "$JANUS_STATE_WORKTREE/state/activator/identity.json" \
            --state-dir "$JANUS_STATE_WORKTREE/state/activator" \
            --model-lock-out runtime/r2-paid-home/model-lock.json \
            --file-fabric-out runtime/r2-paid-home/file-fabric-lock.json \
            --runtime-receipt-out runtime/r2-paid-home/runtime-receipt.json \
            --hrain-context-out runtime/r2-paid-home/hrain-context.json \
            --hrain-receipt-out runtime/r2-paid-home/hrain-context-receipt.json \
            --hrain-workspace runtime/r2-paid-home/hrain-workspace \
            --response-out runtime/r2-paid-home/terminal-response.json \
            > runtime/r2-paid-home/turn-summary.json

      - name: Adjudicate paid HOME/Activator route and seal response
        if: steps.pull.outputs.found == 'true' && steps.state.outputs.existing != 'true'
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from janus_spi.hrain_context_bridge import verify_hrain_context_receipt
          from janus_spi.live_cycle import HardenedJanusPersistentStateV09
          from janus_spi.market_buyer_conversation import build_market_home_response, verify_market_buyer_packet, verify_market_home_response
          from janus_spi.terminal_conversation import verify_terminal_message, verify_terminal_response
          packet=json.load(open('runtime/r2-paid-home/packet.json'))
          request=json.load(open('runtime/r2-paid-home/terminal-request.json'))
          response=json.load(open('runtime/r2-paid-home/terminal-response.json'))
          summary=json.load(open('runtime/r2-paid-home/turn-summary.json'))
          lock=json.load(open('runtime/r2-paid-home/model-lock.json'))
          hreceipt=json.load(open('runtime/r2-paid-home/hrain-context-receipt.json'))
          pull=json.load(open('runtime/r2-paid-home/pull-receipt.json'))
          assert verify_market_buyer_packet(packet)
          assert packet['mode'] == 'PAID_ERC20' and packet['money_enabled'] is True
          assert verify_terminal_message(request)
          assert verify_terminal_response(response, request=request)
          assert request['actor_kind'] == 'MACHINE_BUYER'
          assert request['market_mode'] == 'PAID_ERC20'
          assert request['market_money_enabled'] is True
          assert summary['source_kind'] == 'MARKET_BUYER_CONVERSATION'
          assert summary['classifications'] == ['machine_buyer_read_only_conversation']
          assert summary['mode'] == 'AT_HOME' and summary['return_not_reset'] is True
          assert verify_hrain_context_receipt(hreceipt, model_digest=lock['model_digest'])
          assert response['resident_uuid'] == summary['resident_uuid']
          assert response['command_authority_granted'] is False
          assert response['external_effect_authorized'] is False
          before=Path('runtime/r2-paid-home/resident-before.txt').read_text().strip()
          assert before == response['resident_uuid']
          health=HardenedJanusPersistentStateV09(Path(os.environ['JANUS_STATE_WORKTREE'])/'state/activator').verify()
          assert health['ok'] is True and health['mode'] == 'AT_HOME' and health['resident_uuid'] == before
          source={
            'market_source_commit':pull['market_source_commit'],
            'market_packet_path':pull['market_packet_path'],
            'market_packet_git_blob_sha':pull['market_packet_git_blob_sha'],
            'market_packet_file_sha256':pull['market_packet_file_sha256'],
            'market_packet_hash':pull['market_packet_hash'],
            'pull_receipt_hash':pull['receipt_hash'],
            'transport':pull['transport'],
          }
          sealed=build_market_home_response(packet=packet, terminal_request=request, terminal_response=response, source_binding=source, replayed=False)
          assert verify_market_home_response(sealed)
          assert sealed['money_enabled'] is True
          assert sealed['buyer_query_receipt']['billable_execution_delta'] == 1
          assert sealed['execution_authority_granted'] is False and sealed['external_effect_authorized'] is False
          with open('runtime/r2-paid-home/home-response.json','w',encoding='utf-8') as f:
              json.dump(sealed,f,ensure_ascii=False,indent=2,sort_keys=True); f.write('\n')
          stored=Path(os.environ['JANUS_STATE_WORKTREE'])/'state/activator/market_paid_buyer_responses'/f"{packet['query_id']}.json"
          stored.parent.mkdir(parents=True, exist_ok=True)
          stored.write_bytes(Path('runtime/r2-paid-home/home-response.json').read_bytes())
          print('R2_PAID_HOME_ACTIVATOR_ROUTE=PASS')
          print('R2_PAID_SAME_RESIDENT_UUID=PASS')
          print('R2_PAID_HRAIN_CONTEXT_BOUND=PASS')
          print('R2_PAID_RETURN_HOME=PASS')
          print('R2_PAID_EFFECT_AUTHORITY=FALSE')
          PY

      - name: Verify recovered response is identical and read-only
        if: steps.pull.outputs.found == 'true' && steps.state.outputs.existing == 'true'
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from janus_spi.market_buyer_conversation import verify_market_home_response
          value=json.load(open('runtime/r2-paid-home/home-response.json'))
          assert verify_market_home_response(value)
          assert value['mode'] == 'PAID_ERC20' and value['money_enabled'] is True
          assert value['execution_authority_granted'] is False and value['external_effect_authorized'] is False
          print('R2_PAID_EXACT_RETRY_NO_SECOND_COGNITION=PASS')
          PY

      - name: Commit new paid cognitive checkpoint to HOME state
        if: steps.pull.outputs.found == 'true' && steps.state.outputs.existing != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$JANUS_STATE_WORKTREE"
          git config user.name "JANUS Paid Market Buyer HOME"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/activator
          if git diff --cached --quiet; then
            echo 'R2_PAID_HOME_STATE_COMMIT=NO_CHANGE_REPLAY'
          else
            git commit -m "R2 paid Market buyer query ${{ steps.pull.outputs.query_id }}"
            git push origin HEAD:refs/heads/janus/activator-state
            echo 'R2_PAID_HOME_STATE_COMMIT=PASS'
          fi

      - name: Fresh-checkout verify paid response and resident
        if: steps.pull.outputs.found == 'true'
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          replay="$RUNNER_TEMP/janus-paid-replay"
          rm -rf "$replay"
          git worktree add --detach "$replay" origin/janus/activator-state
          JANUS_REPLAY="$replay" python - <<'PY'
          import json, os
          from pathlib import Path
          from janus_spi.live_cycle import HardenedJanusPersistentStateV09
          from janus_spi.market_buyer_conversation import verify_market_home_response
          root=Path(os.environ['JANUS_REPLAY'])/'state/activator'
          packet=json.load(open('runtime/r2-paid-home/packet.json'))
          stored=json.loads((root/'market_paid_buyer_responses'/f"{packet['query_id']}.json").read_text())
          before=Path('runtime/r2-paid-home/resident-before.txt').read_text().strip()
          health=HardenedJanusPersistentStateV09(root).verify()
          assert health['ok'] is True and health['mode'] == 'AT_HOME'
          assert health['resident_uuid'] == before == stored['buyer_query_receipt']['resident_uuid']
          assert verify_market_home_response(stored)
          assert stored['payment_reference'] == packet['payment_receipt']['payment_reference']
          print('R2_PAID_FRESH_WORKTREE_REPLAY=PASS')
          print('R2_PAID_SAME_RESPONSE_IDENTITY=PASS')
          PY

      - name: Publish create-only paid HOME result
        if: steps.pull.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          responsewt="$RUNNER_TEMP/janus-market-paid-responses-publish"
          rm -rf "$responsewt"
          git config user.name "JANUS Paid Market Buyer Response"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin janus/market-responses:refs/remotes/origin/janus/market-responses
          git worktree add -B janus-market-paid-responses-local "$responsewt" origin/janus/market-responses
          mkdir -p "$responsewt/.janus/market-paid-responses"
          printf '%s\n' '{"schema":"janus.home.market_paid_response_mailbox.v1","role":"CREATE_ONLY_HOME_TO_MARKET_PAID_BUYER_RESPONSES","transport":"CREDENTIALLESS_PUBLIC_READ","cross_repo_write_authority":false,"payment_is_execution_authority":false}' > "$responsewt/.janus/market-paid-responses/MANIFEST.json"
          target="$responsewt/.janus/market-paid-responses/${{ steps.pull.outputs.query_id }}.paid-result.json"
          if [ -f "$target" ]; then
            cmp -s runtime/r2-paid-home/home-response.json "$target" || { echo 'R2_PAID_HOME_RESULT_CREATE_ONLY_CONFLICT' >&2; exit 2; }
            echo 'R2_PAID_HOME_RESULT_ALREADY_PUBLISHED_IDENTICAL=TRUE'
          else
            cp runtime/r2-paid-home/home-response.json "$target"
          fi
          cd "$responsewt"
          git add .janus/market-paid-responses
          if git diff --cached --quiet; then
            echo 'R2_PAID_HOME_RESULT_COMMIT=NO_CHANGE_EXACT_RETRY'
          else
            git commit -m "R2 paid HOME result ${{ steps.pull.outputs.query_id }}"
            git push origin HEAD:refs/heads/janus/market-responses
            echo 'R2_PAID_HOME_RESULT_COMMIT=PASS'
          fi
          echo 'CROSS_REPO_WRITE_CREDENTIAL_USED=FALSE'

      - name: Upload paid HOME witness
        if: steps.pull.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: janus-r2-paid-home-${{ steps.pull.outputs.query_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/r2-paid-home
          if-no-files-found: error
