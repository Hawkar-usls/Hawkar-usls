name: JANUS Activator Execution Grant

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/janus_spi/execution_grant.py'
      - 'src/janus_spi/persistent_state_v07.py'
      - 'run_janus_execution_grant.py'
      - 'run_janus_activator_hearth.py'
      - 'tests/test_execution_grant.py'
      - 'tests/test_persistent_state_v07.py'
      - '.janus/activator/EXECUTION_GRANT_CONSTITUTION.json'
      - '.janus/activator/EXECUTION_GRANT.schema.json'
      - '.github/workflows/janus-activator-execution-grant.yml'
  push:
    branches: [main]
    paths:
      - 'src/janus_spi/execution_grant.py'
      - 'src/janus_spi/persistent_state_v07.py'
      - 'run_janus_execution_grant.py'
      - 'run_janus_activator_hearth.py'
      - 'tests/test_execution_grant.py'
      - 'tests/test_persistent_state_v07.py'
      - '.janus/activator/EXECUTION_GRANT_CONSTITUTION.json'
      - '.janus/activator/EXECUTION_GRANT.schema.json'
      - '.github/workflows/janus-activator-execution-grant.yml'
  workflow_dispatch:
    inputs:
      final_receipt_hash:
        description: 'Exact receipt_hash from persistent ACK authenticated-finalization ledger'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: janus-activator-state-writer
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile P12 gate
        run: python -m compileall -q src/janus_spi/execution_grant.py src/janus_spi/persistent_state_v07.py run_janus_execution_grant.py tests/test_execution_grant.py tests/test_persistent_state_v07.py
      - name: Validate P12 contracts
        run: |
          python -m json.tool .janus/activator/EXECUTION_GRANT_CONSTITUTION.json >/dev/null
          python -m json.tool .janus/activator/EXECUTION_GRANT.schema.json >/dev/null
      - name: Run P12 full-lineage adversarial tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_execution_grant.py tests/test_persistent_state_v07.py

  issue-grant:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out reviewed HOME architecture
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime and preserve reviewed engine
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          engine="${RUNNER_TEMP}/janus-execution-grant-engine"
          mkdir -p "$engine"
          cp -a src "$engine/src"
          cp run_janus_execution_grant.py "$engine/"
          cp run_janus_activator_hearth.py "$engine/"
          echo "EXECUTION_GRANT_ENGINE=$engine" >> "$GITHUB_ENV"

      - name: Resume persistent Activator HOME state only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JANUS Execution Grant"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          git switch --create janus/activator-state --track origin/janus/activator-state
          test "$(git branch --show-current)" = "janus/activator-state"

      - name: Verify persistent HOME before P12
        env:
          PYTHONPATH: ${{ env.EXECUTION_GRANT_ENGINE }}/src
        run: |
          python "$EXECUTION_GRANT_ENGINE/run_janus_activator_hearth.py" \
            --state-dir state/activator verify > "$RUNNER_TEMP/pre-p12-health.json"

      - name: Resolve exact eligible final receipt from persistent ledger
        env:
          FINAL_RECEIPT_HASH: ${{ inputs.final_receipt_hash }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          wanted=os.environ['FINAL_RECEIPT_HASH'].strip()
          if len(wanted) != 64:
              raise SystemExit('FINAL_RECEIPT_HASH_MUST_BE_64_HEX')
          path=Path('state/activator/ack_authenticated_finalization_ledger.jsonl')
          if not path.is_file():
              raise SystemExit('NO_PERSISTENT_ACK_FINALIZATION_LEDGER')
          rows=[json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          matches=[row for row in rows if row.get('receipt_hash') == wanted]
          if len(matches) != 1:
              raise SystemExit(f'EXACT_FINAL_RECEIPT_MATCH_COUNT={len(matches)}')
          out=Path(os.environ['RUNNER_TEMP'])/'p12-final-receipt.json'
          out.write_text(json.dumps(matches[0], ensure_ascii=False, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print('P12_EXACT_PERSISTENT_FINAL_RECEIPT=PASS')
          PY

      - name: Issue bounded read-only execution grant
        env:
          PYTHONPATH: ${{ env.EXECUTION_GRANT_ENGINE }}/src
        run: |
          python "$EXECUTION_GRANT_ENGINE/run_janus_execution_grant.py" \
            --state-dir state/activator \
            --final-receipt "$RUNNER_TEMP/p12-final-receipt.json" \
            --output "$RUNNER_TEMP/p12-grant.json" \
            --require-issued

      - name: Verify HOME after grant and commit state only
        env:
          PYTHONPATH: ${{ env.EXECUTION_GRANT_ENGINE }}/src
        shell: bash
        run: |
          set -euo pipefail
          python "$EXECUTION_GRANT_ENGINE/run_janus_activator_hearth.py" \
            --state-dir state/activator verify > "$RUNNER_TEMP/post-p12-health.json"
          git add state/activator/execution_grant_ledger.jsonl state/activator/health.json
          git commit -m "Execution grant ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD:refs/heads/janus/activator-state
          echo "P12_STATE_BRANCH_COMMIT=PASS"
          echo "P12_MAIN_MUTATION=FALSE"
          echo "P12_EXTERNAL_EFFECT_AUTHORITY=FALSE"

      - name: Fresh-worktree replay after P12
        env:
          PYTHONPATH: ${{ env.EXECUTION_GRANT_ENGINE }}/src
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          replay="${RUNNER_TEMP}/p12-state-replay"
          git worktree add --detach "$replay" origin/janus/activator-state
          python "$EXECUTION_GRANT_ENGINE/run_janus_activator_hearth.py" \
            --state-dir "$replay/state/activator" verify > "$RUNNER_TEMP/p12-replay-health.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          v=json.loads(Path(os.environ['RUNNER_TEMP']+'/p12-replay-health.json').read_text())
          assert v['ok'] is True
          assert v['component_integrity']['execution_grant'] is True
          print('P12_PERSISTENT_REPLAY=PASS')
          print('EXECUTION_GRANT_PERSISTED=TRUE')
          print('TARGET_EXECUTION_PERFORMED=FALSE')
          PY
