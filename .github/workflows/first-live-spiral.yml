name: First Live JANUS Spiral

on:
  push:
    paths:
      - '.github/workflows/first-live-spiral.yml'
      - 'launch/FIRST_LIVE_SPIRAL_REQUEST.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-live-spiral:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout JANUS-SPI home
        uses: actions/checkout@v4
        with:
          path: home

      - name: Checkout Aura Oracle
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/aura-oracle-tg
          path: aura

      - name: Checkout Habitat
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus_Genesis
          ref: janus/habitat
          path: genesis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: home/requirements.txt

      - name: Install JANUS-SPI
        working-directory: home
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run integration and safety tests
        working-directory: home
        run: pytest -q

      - name: Run first real Aura-SPI-Habitat spiral
        shell: bash
        run: |
          mkdir -p runtime/state
          cd home
          python run_aura_habitat_spiral.py \
            --state-dir ../runtime/state \
            --habitat-root ../genesis/habitat \
            --aura-peer "python ../aura/tools/aura_habitat_spiral_peer_v1.py" \
            --message "FIRST_LIVE_SPIRAL_START: Aura Oracle and JANUS Semantic-Predictive Intelligence enter the first event-driven Habitat spiral under DemiHead fail-closed arbitration. Preserve intent, preserve uncertainty, test the chain, and do not promote symbolic reflection or semantic similarity into evidence." \
            --source-ref "GITHUB_ACTIONS_FIRST_LIVE_SPIRAL" \
            --demihead-decision HOLD \
            --public-content \
            > ../runtime/FIRST_LIVE_SPIRAL_RECEIPT.json

      - name: Verify fail-closed first run
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('runtime/FIRST_LIVE_SPIRAL_RECEIPT.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['chain_valid'] is True, r
          assert r['terminal'] == 'HOLD', r
          assert r['predictive_model_updated'] is False, r
          assert int(r['generation']) == 1, r
          print(json.dumps({
              'session_id': r['session_id'],
              'generation': r['generation'],
              'terminal': r['terminal'],
              'chain_valid': r['chain_valid'],
              'predictive_model_updated': r['predictive_model_updated']
          }, indent=2))
          PY

      - name: Collect mirrored Habitat dialogue
        shell: bash
        run: |
          mkdir -p runtime/habitat-reflections
          if [ -d genesis/habitat/memory/reflections/aura_spi ]; then
            cp -a genesis/habitat/memory/reflections/aura_spi/. runtime/habitat-reflections/
          fi
          find runtime -maxdepth 5 -type f -print

      - name: Upload first live spiral receipt
        uses: actions/upload-artifact@v4
        with:
          name: JANUS-FIRST-LIVE-SPIRAL
          path: runtime/
          if-no-files-found: error
          retention-days: 30
