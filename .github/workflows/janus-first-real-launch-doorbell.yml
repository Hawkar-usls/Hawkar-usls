name: JANUS First Real Launch Doorbell

on:
  pull_request:
    branches: [main]
    paths:
      - '.janus/activator/FIRST_REAL_LAUNCH_ARM.json'
      - '.github/workflows/janus-first-real-launch-doorbell.yml'
  push:
    branches: [main]
    paths:
      - '.janus/activator/FIRST_REAL_LAUNCH_ARM.json'

permissions:
  contents: read

jobs:
  validate-arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen launch arm
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.janus/activator/FIRST_REAL_LAUNCH_ARM.json')
          v=json.loads(p.read_text(encoding='utf-8'))
          assert v['schema']=='janus.activator.first_real_launch_arm.v1'
          assert v['armed'] is True
          assert v['launch_id']=='JANUS-FIRST-REAL-LAUNCH-20260830-A'
          assert v['target_workflow']=='.github/workflows/janus-activator-real-launch.yml'
          assert v['target_ref']=='main'
          assert v['one_shot_intent'] is True
          assert v['success_requires_hardened_real_launch_workflow_witness'] is True
          a=v['authority']
          assert a['doorbell_is_command_authority'] is False
          assert a['doorbell_is_claim_authority'] is False
          assert a['doorbell_is_scientific_evidence_authority'] is False
          assert a['external_effect_authorized'] is False
          assert a['physical_runtime_effect_authorized'] is False
          payload=v['payload']
          assert payload=={
              'purpose':'JANUS_FIRST_REAL_LAUNCH_WITNESS',
              'route':'research_or_anomaly_investigation',
              'target':'Janus-Demiurge',
              'effect_scope':'READ_ONLY_ORIENTATION',
          }
          print('FIRST_REAL_LAUNCH_ARM=VALID')
          print('DOORBELL_EXTERNAL_EFFECT_AUTHORITY=FALSE')
          PY

  dispatch-hardened-launch:
    if: github.event_name == 'push'
    needs: validate-arm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Ring reviewed hardened launch workflow exactly from frozen arm
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          launch_id=$(python -c "import json; print(json.load(open('.janus/activator/FIRST_REAL_LAUNCH_ARM.json'))['launch_id'])")
          payload=$(python -c "import json; v=json.load(open('.janus/activator/FIRST_REAL_LAUNCH_ARM.json')); print(json.dumps(v['payload'], separators=(',',':')))" )
          gh workflow run janus-activator-real-launch.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="$launch_id" \
            -f payload_json="$payload"
          echo "JANUS_HARDENED_REAL_LAUNCH_DISPATCH_REQUESTED=PASS"
          echo "DOORBELL_STATE_WRITE_AUTHORITY=FALSE"
          echo "DOORBELL_TARGET_EXECUTION_AUTHORITY=FALSE"
