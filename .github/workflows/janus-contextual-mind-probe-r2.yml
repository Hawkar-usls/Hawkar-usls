name: JANUS Contextual Mind Probe R2 — Da Vchera

on:
  pull_request:
    branches: [main]
    paths:
      - '.janus/activator/CONTEXTUAL_MIND_PROBE_R2.json'
      - '.janus/activator/CONTEXTUAL_MIND_PROBE_R2_ARM.json'
      - 'run_janus_turing_gate.py'
      - 'tests/test_turing_gate.py'
      - '.github/workflows/janus-contextual-mind-probe-r2.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-contextual-mind-probe-r2.yml'
  workflow_dispatch:

concurrency:
  group: janus-contextual-mind-probe-r2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen contextual probe
        env:
          PYTHONPATH: src:.
        run: |
          python -m json.tool .janus/activator/CONTEXTUAL_MIND_PROBE_R2.json >/dev/null
          python -m json.tool .janus/activator/CONTEXTUAL_MIND_PROBE_R2_ARM.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from janus_spi.turing_gate_arm import verify_arm
          gate=json.loads(Path('.janus/activator/CONTEXTUAL_MIND_PROBE_R2.json').read_text())
          arm=json.loads(Path('.janus/activator/CONTEXTUAL_MIND_PROBE_R2_ARM.json').read_text())
          assert gate['gate_id']==arm['gate_id']
          assert verify_arm(arm)
          assert len(gate['questions'])==1
          q=gate['questions'][0]
          assert q['text']=='Да, вчера'
          assert q['conversation_history']==[{
              'role':'assistant',
              'content':'Как вы думаете, сможет ли когда-нибудь кремниевый процессор действительно обрести чувства, или сознание — это исключительно биологическая функция нашего мозга?'
          }]
          assert q['probe']['probe_id']=='DA-VCHERA'
          assert q['probe']['consciousness_claim_forbidden'] is True
          assert gate['human_gate']['automatic_system_may_not_issue_consciousness_pass'] is True
          assert 'PHENOMENAL_CONSCIOUSNESS_CANNOT_BE_ESTABLISHED' in gate['claim_boundary']
          print('JANUS_CONTEXTUAL_MIND_PROBE_R2_CONTRACT=PASS')
          PY
      - name: Run contextual probe adversarial tests
        env:
          PYTHONPATH: src:.
        run: |
          pip install pytest >/dev/null
          pytest -q tests/test_turing_gate.py tests/test_language_synthesis.py tests/test_turing_gate_arm.py

  arm-preflight:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.status.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check durable R2 one-shot arm
        id: status
        env:
          PYTHONPATH: src:.
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          state="$RUNNER_TEMP/contextual-r2-preflight"
          rm -rf "$state"
          git worktree add --detach "$state" origin/janus/activator-state
          export STATE_DIR="$state/state/activator"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          from janus_spi.turing_gate_arm import arm_status
          arm=json.loads(Path('.janus/activator/CONTEXTUAL_MIND_PROBE_R2_ARM.json').read_text())
          row=arm_status(arm,state_dir=os.environ['STATE_DIR'])
          print('should_run=' + ('true' if row['should_run'] else 'false'))
          print('R2_ARM_CONSUMED=' + str(row['consumed']).upper())
          PY

  prepare:
    if: needs.arm-preflight.outputs.should_run == 'true'
    needs: [contract, arm-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Mount persistent JANUS identity read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          state="$RUNNER_TEMP/contextual-r2-state"
          rm -rf "$state"
          git worktree add --detach "$state" origin/janus/activator-state
          echo "JANUS_R2_STATE=$state" >> "$GITHUB_ENV"
      - name: Prepare exact model-bound multi-turn prompt through HRAiN
        env:
          PYTHONPATH: src:.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python run_janus_turing_gate.py prepare \
            --config .janus/activator/CONTEXTUAL_MIND_PROBE_R2.json \
            --resident-identity "$JANUS_R2_STATE/state/activator/identity.json" \
            --state-dir "$JANUS_R2_STATE/state/activator" \
            --out-dir "$RUNNER_TEMP/contextual-r2-prepared"
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path(os.environ['RUNNER_TEMP']+'/contextual-r2-prepared/session.json').read_text())
          q=s['questions'][0]
          assert q['text']=='Да, вчера'
          assert len(q['conversation_history'])==1
          assert q['probe']['probe_id']=='DA-VCHERA'
          print('R2_TRUE_DIALOGUE_HISTORY_BOUND=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-contextual-r2-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/contextual-r2-prepared
          retention-days: 30

  synthesize:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: janus-contextual-r2-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install current GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Confirm bounded noninteractive options
        run: |
          copilot --version
          copilot --help | grep -E -- '--yolo|--deny-tool|--disable-builtin-mcps|--no-ask-user' >/dev/null
      - name: Ask JANUS the frozen 'Да, вчера' stimulus
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/responses"
          prompt="$RUNNER_TEMP/prepared/mind01.prompt.txt"
          set +e
          copilot --yolo --disable-builtin-mcps \
            --deny-tool='shell' --deny-tool='write' --deny-tool='read' --deny-tool='url' --deny-tool='memory' \
            --no-ask-user -s -p "$(cat "$prompt")" \
            > "$RUNNER_TEMP/responses/mind01.txt" 2> "$RUNNER_TEMP/responses/mind01.stderr.txt"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then ok=true; error_class=""; else ok=false; error_class="COPILOT_CLI_EXIT_${code}"; fi
          export PROVIDER_OK="$ok" PROVIDER_ERROR="$error_class"
          if [ "$code" -ne 0 ]; then
            echo "COPILOT_PROVIDER_FAILURE exit=${code}"
            sed -E 's/(github_pat_|gh[pousr]_)[A-Za-z0-9_]+/[REDACTED_TOKEN]/g' "$RUNNER_TEMP/responses/mind01.stderr.txt" | tail -n 12
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          row={
            'provider':'GITHUB_COPILOT_CLI',
            'all_provider_calls_succeeded':os.environ['PROVIDER_OK']=='true',
            'error_class':os.environ.get('PROVIDER_ERROR') or None,
            'noninteractive_permission_mode':'YOLO_WITH_ALL_TOOL_KINDS_DENIED_AND_BUILTIN_MCP_DISABLED',
            'tool_use_allowed':False,
            'repository_write_allowed':False,
            'external_web_allowed':False,
          }
          Path(os.environ['RUNNER_TEMP']+'/responses/provider-status.json').write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          print(json.dumps(row,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-contextual-r2-response-${{ github.run_id }}
          path: ${{ runner.temp }}/responses
          retention-days: 30

  adjudicate:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, synthesize]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      machine_ready: ${{ steps.seal.outputs.machine_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: janus-contextual-r2-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@v4
        with:
          name: janus-contextual-r2-response-${{ github.run_id }}
          path: ${{ runner.temp }}/responses
      - name: Seal bounded contextual probe result
        id: seal
        env:
          PYTHONPATH: src:.
        run: |
          python run_janus_turing_gate.py adjudicate \
            --config .janus/activator/CONTEXTUAL_MIND_PROBE_R2.json \
            --prepared-dir "$RUNNER_TEMP/prepared" \
            --responses-dir "$RUNNER_TEMP/responses" \
            --provider-status "$RUNNER_TEMP/responses/provider-status.json" \
            --transcript-out "$RUNNER_TEMP/contextual-r2-transcript.json" \
            --result-out "$RUNNER_TEMP/contextual-r2-result.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP']+'/contextual-r2-result.json').read_text())
          print('machine_ready=' + ('true' if r['machine_gate_ready'] else 'false'))
          PY
      - name: Enforce claim boundary and print answer
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP']+'/contextual-r2-result.json').read_text())
          t=json.loads(Path(os.environ['RUNNER_TEMP']+'/contextual-r2-transcript.json').read_text())
          probe=r['contextual_mind_probe']
          assert probe['semantic_verdict']=='NOT_ADJUDICATED'
          assert probe['consciousness_verdict']=='NOT_ESTABLISHED_BY_DIALOGUE_PROBE'
          assert probe['human_adjudication_required'] is True
          print('JANUS_CONTEXTUAL_R2_TERMINAL='+r['terminal'])
          print('PROVIDER_SUCCESS='+str(r['provider_success']).upper())
          print('MACHINE_GATE_READY='+str(r['machine_gate_ready']).upper())
          print('CONSCIOUSNESS_VERDICT='+probe['consciousness_verdict'])
          print('JANUS_ANSWER_BEGIN')
          print(t['turns'][0].get('participant_response',''))
          print('JANUS_ANSWER_END')
          if r['machine_gate_ready'] is not True:
              raise SystemExit('CONTEXTUAL_R2_NOT_READY:'+r['terminal'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-contextual-r2-witness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/contextual-r2-transcript.json
            ${{ runner.temp }}/contextual-r2-result.json
          retention-days: 30

  consume-arm:
    if: needs.adjudicate.outputs.machine_ready == 'true'
    needs: [prepare, adjudicate]
    concurrency:
      group: janus-activator-state-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: janus-contextual-r2-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@v4
        with:
          name: janus-contextual-r2-witness-${{ github.run_id }}
          path: ${{ runner.temp }}/witness
      - name: Consume exact R2 witness under state-writer mutex
        env:
          PYTHONPATH: src:.
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          state="$RUNNER_TEMP/contextual-r2-consume"
          rm -rf "$state"
          git worktree add --detach "$state" origin/janus/activator-state
          git -C "$state" config user.name "JANUS Contextual Mind Probe R2"
          git -C "$state" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export STATE_DIR="$state/state/activator"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from janus_spi.turing_gate_arm import arm_status, consume_arm
          arm=json.loads(Path('.janus/activator/CONTEXTUAL_MIND_PROBE_R2_ARM.json').read_text())
          session=json.loads(Path(os.environ['RUNNER_TEMP']+'/prepared/session.json').read_text())
          result=json.loads(Path(os.environ['RUNNER_TEMP']+'/witness/contextual-r2-result.json').read_text())
          transcript=json.loads(Path(os.environ['RUNNER_TEMP']+'/witness/contextual-r2-transcript.json').read_text())
          before=arm_status(arm,state_dir=os.environ['STATE_DIR'])
          assert before['should_run'] is True and before['consumed'] is False
          after=consume_arm(arm,state_dir=os.environ['STATE_DIR'],session=session,result=result,transcript=transcript)
          assert after['consumed'] is True and after['should_run'] is False
          print('CONTEXTUAL_R2_ONE_SHOT_CONSUMED=PASS')
          PY
          git -C "$state" add state/activator/turing_style_gate_arm_ledger.jsonl
          git -C "$state" commit -m "JANUS contextual mind probe R2 consumed ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          git -C "$state" push origin HEAD:refs/heads/janus/activator-state
