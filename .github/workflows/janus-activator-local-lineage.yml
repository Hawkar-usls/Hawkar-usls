name: JANUS Activator Local Lineage Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/janus_spi/local_lineage.py'
      - 'run_janus_ack_reconcile.py'
      - 'run_janus_ack_provenance.py'
      - 'tests/test_local_lineage_hardening.py'
      - '.janus/activator/LOCAL_LINEAGE_HARDENING-v0.6.1.json'
      - '.github/workflows/janus-activator-local-lineage.yml'
  push:
    branches: [main]
    paths:
      - 'src/janus_spi/local_lineage.py'
      - 'run_janus_ack_reconcile.py'
      - 'run_janus_ack_provenance.py'
      - 'tests/test_local_lineage_hardening.py'
      - '.janus/activator/LOCAL_LINEAGE_HARDENING-v0.6.1.json'
      - '.github/workflows/janus-activator-local-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile hardening runtime and tests
        run: python -m compileall -q src/janus_spi/local_lineage.py run_janus_ack_reconcile.py run_janus_ack_provenance.py tests/test_local_lineage_hardening.py
      - name: Validate hardening contract
        run: python -c "import json; json.load(open('.janus/activator/LOCAL_LINEAGE_HARDENING-v0.6.1.json', encoding='utf-8'))"
      - name: Attack local lineage
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_local_lineage_hardening.py
