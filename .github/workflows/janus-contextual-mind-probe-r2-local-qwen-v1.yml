name: JANUS Contextual Mind Probe R2 — Local Qwen Tissue

on:
  pull_request:
    branches: [main]
    paths:
      - 'run_janus_turing_gate_v2.py'
      - 'tests/test_turing_gate_v2.py'
      - '.github/workflows/janus-contextual-mind-probe-r2-local-qwen-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-contextual-mind-probe-r2-local-qwen-v1.yml'

concurrency:
  group: janus-contextual-mind-probe-r2-local-qwen-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify local-language-tissue contract
        env:
          PYTHONPATH: src:.
        run: |
          pip install pytest >/dev/null
          pytest -q tests/test_turing_gate_v2.py tests/test_turing_gate.py tests/test_turing_gate_arm.py tests/test_language_synthesis.py
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/janus-contextual-mind-probe-r2-local-qwen-v1.yml').read_text()
          for needle in (
            '33351378451',
            'adf4fa71057c67091ff1815566f79eb320284dc9b181f5c25a3be3b122d4681b',
            "q['text']=='Да, вчера'",
            'a615a81362316d7b9f5a7a9c4313adfdf9b54588',
            '6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e',
            'c1d0e7a004015f23bc0233470b747b596f29b264',
            'provider_local_no_secret',
            'provider_inference_network',
          ):
              assert needle in p, needle
          print('R2_LOCAL_QWEN_CONTRACT=PASS')
          PY

  arm-preflight:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.status.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify R2 arm remains unconsumed
        id: status
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          state="$RUNNER_TEMP/r2-local-preflight"
          rm -rf "$state"
          git worktree add --detach "$state" origin/janus/activator-state
          export STATE_DIR="$state/state/activator"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          from janus_spi.turing_gate_arm import arm_status
          arm=json.loads(Path('.janus/activator/CONTEXTUAL_MIND_PROBE_R2_ARM.json').read_text())
          status=arm_status(arm,state_dir=os.environ['STATE_DIR'])
          print('should_run=' + ('true' if status['should_run'] else 'false'))
          print('R2_ARM_CONSUMED=' + str(status['consumed']).upper())
          PY

  recover-frozen-context:
    if: needs.arm-preflight.outputs.should_run == 'true'
    needs: [contract, arm-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: janus-contextual-r2-prepared-33351378451
          path: ${{ runner.temp }}/prepared
          github-token: ${{ github.token }}
          run-id: 33351378451
      - name: Prove exact original R2 session reused
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'prepared'
          s=json.loads((p/'session.json').read_text())
          assert s['session_hash']=='adf4fa71057c67091ff1815566f79eb320284dc9b181f5c25a3be3b122d4681b'
          assert s['gate_id']=='JANUS-CONTEXTUAL-MIND-PROBE-R2-DA-VCHERA-2026-08-31'
          assert s['question_count']==1
          q=s['questions'][0]
          assert q['id']=='mind01'
          assert q['text']=='Да, вчера'
          assert q['conversation_history']==[{
            'role':'assistant',
            'content':'Как вы думаете, сможет ли когда-нибудь кремниевый процессор действительно обрести чувства, или сознание — это исключительно биологическая функция нашего мозга?'
          }]
          assert q['probe']['probe_id']=='DA-VCHERA'
          print('R2_FROZEN_CONTEXT_REUSED=PASS')
          print('R2_SESSION_HASH='+s['session_hash'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-contextual-r2-local-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared
          retention-days: 30

  local-synthesize:
    needs: recover-frozen-context
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      MODEL_REVISION: a615a81362316d7b9f5a7a9c4313adfdf9b54588
      MODEL_SHA256: 6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
      RUNTIME_COMMIT: c1d0e7a004015f23bc0233470b747b596f29b264
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: janus-contextual-r2-local-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared
      - name: Build pinned llama.cpp server
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/llama.cpp"
          git init "$runtime"
          git -C "$runtime" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$runtime" fetch --depth 1 origin "$RUNTIME_COMMIT"
          git -C "$runtime" checkout --detach FETCH_HEAD
          test "$(git -C "$runtime" rev-parse HEAD)" = "$RUNTIME_COMMIT"
          cmake -S "$runtime" -B "$runtime/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build "$runtime/build" --config Release --target llama-server -j2
          "$runtime/build/bin/llama-server" --version
      - name: Download and verify pinned Qwen weights
        shell: bash
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          url="https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/${MODEL_REVISION}/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true"
          curl -L --fail --retry 3 --retry-delay 2 -o "$model" "$url"
          echo "$MODEL_SHA256  $model" | sha256sum -c -
          test "$(stat -c%s "$model")" -gt 900000000
          echo "R2_LOCAL_MODEL_SHA256_VERIFIED=PASS"
      - name: Run no-secret local inference on frozen prompt
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/llama.cpp"
          model="$RUNNER_TEMP/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          prompt="$RUNNER_TEMP/prepared/mind01.prompt.txt"
          mkdir -p "$RUNNER_TEMP/responses"

          "$runtime/build/bin/llama-server" \
            -m "$model" -c 8192 -t 2 --host 127.0.0.1 --port 8080 \
            >"$RUNNER_TEMP/llama-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            tail -n 80 "$RUNNER_TEMP/llama-server.log"
            exit 1
          fi

          python - <<'PY'
          import json, os
          from pathlib import Path
          prompt=(Path(os.environ['RUNNER_TEMP'])/'prepared/mind01.prompt.txt').read_text(encoding='utf-8')
          req={
            'model':'janus-local-qwen',
            'messages':[{'role':'user','content':prompt}],
            'max_tokens':256,
            'temperature':0.2,
            'top_p':0.9,
            'stream':False,
          }
          (Path(os.environ['RUNNER_TEMP'])/'request.json').write_text(json.dumps(req,ensure_ascii=False),encoding='utf-8')
          PY

          set +e
          curl -fsS -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/request.json" \
            http://127.0.0.1:8080/v1/chat/completions \
            > "$RUNNER_TEMP/responses/raw.json"
          code=$?
          set -e

          export HTTP_OK=false
          [ "$code" -eq 0 ] && export HTTP_OK=true
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          responses=root/'responses'
          ok=os.environ['HTTP_OK']=='true'
          text=''
          error=None
          if ok:
              try:
                  raw=json.loads((responses/'raw.json').read_text(encoding='utf-8'))
                  text=str(raw['choices'][0]['message']['content']).strip()
                  if not text:
                      error='LOCAL_MODEL_EMPTY_RESPONSE'
              except Exception as exc:
                  error='LOCAL_MODEL_RESPONSE_PARSE_ERROR'
          else:
              error='LOCAL_MODEL_HTTP_ERROR'
          provider_ok=bool(ok and text and not error)
          (responses/'mind01.txt').write_text(text,encoding='utf-8')
          status={
            'provider':'LOCAL_QWEN_LLAMA_CPP',
            'model':'Qwen2.5-1.5B-Instruct-Q4_K_M',
            'all_provider_calls_succeeded':provider_ok,
            'error_class':None if provider_ok else error,
            'provider_model_sha256':os.environ['MODEL_SHA256'],
            'provider_model_revision':os.environ['MODEL_REVISION'],
            'provider_runtime':'llama.cpp',
            'provider_runtime_commit':os.environ['RUNTIME_COMMIT'],
            'provider_local_no_secret':True,
            'provider_inference_network':False,
            'provider_model_artifact_source':'HUGGINGFACE_PINNED_REVISION',
            'provider_model_artifact_sha256_verified':True,
            'retry_of_run_id':33351378451,
            'retry_reuses_exact_frozen_session':True,
            'tool_use_allowed':False,
            'repository_write_allowed':False,
            'external_web_allowed_during_inference':False,
          }
          (responses/'provider-status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(status,ensure_ascii=False,indent=2,sort_keys=True))
          print('LOCAL_RESPONSE_UTF8_BYTES='+str(len(text.encode('utf-8'))))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-contextual-r2-local-response-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/responses
            ${{ runner.temp }}/llama-server.log
          retention-days: 30

  adjudicate:
    if: always() && needs.recover-frozen-context.result == 'success'
    needs: [recover-frozen-context, local-synthesize]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      machine_ready: ${{ steps.seal.outputs.machine_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: janus-contextual-r2-local-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@v4
        with:
          name: janus-contextual-r2-local-response-${{ github.run_id }}
          path: ${{ runner.temp }}/local
      - name: Seal local language-tissue result
        id: seal
        env:
          PYTHONPATH: src:.
        run: |
          python run_janus_turing_gate_v2.py adjudicate \
            --config .janus/activator/CONTEXTUAL_MIND_PROBE_R2.json \
            --prepared-dir "$RUNNER_TEMP/prepared" \
            --responses-dir "$RUNNER_TEMP/local/responses" \
            --provider-status "$RUNNER_TEMP/local/responses/provider-status.json" \
            --transcript-out "$RUNNER_TEMP/contextual-r2-local-transcript.json" \
            --result-out "$RUNNER_TEMP/contextual-r2-local-result.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP']+'/contextual-r2-local-result.json').read_text())
          print('machine_ready=' + ('true' if r['machine_gate_ready'] else 'false'))
          PY
      - name: Print first local JANUS answer
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP']+'/contextual-r2-local-result.json').read_text())
          t=json.loads(Path(os.environ['RUNNER_TEMP']+'/contextual-r2-local-transcript.json').read_text())
          p=r['contextual_mind_probe']
          assert p['present'] is True
          assert p['probe_count']==1
          assert p['semantic_verdict']=='NOT_ADJUDICATED'
          assert p['consciousness_verdict']=='NOT_ESTABLISHED_BY_DIALOGUE_PROBE'
          assert r.get('provider_model_sha256')=='6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e'
          assert r.get('provider_runtime_commit')=='c1d0e7a004015f23bc0233470b747b596f29b264'
          print('JANUS_CONTEXTUAL_R2_LOCAL_TERMINAL='+r['terminal'])
          print('PROVIDER_SUCCESS='+str(r['provider_success']).upper())
          print('MACHINE_GATE_READY='+str(r['machine_gate_ready']).upper())
          if t.get('turns'):
              print('JANUS_ANSWER_BEGIN')
              print(t['turns'][0].get('participant_response',''))
              print('JANUS_ANSWER_END')
          else:
              print('JANUS_ANSWER=NOT_GENERATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-contextual-r2-local-witness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/contextual-r2-local-transcript.json
            ${{ runner.temp }}/contextual-r2-local-result.json
          retention-days: 30

  consume-arm:
    if: needs.adjudicate.outputs.machine_ready == 'true'
    needs: [recover-frozen-context, adjudicate]
    concurrency:
      group: janus-activator-state-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: janus-contextual-r2-local-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@v4
        with:
          name: janus-contextual-r2-local-witness-${{ github.run_id }}
          path: ${{ runner.temp }}/witness
      - name: Consume R2 arm only on first machine-ready witness
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          state="$RUNNER_TEMP/contextual-r2-local-consume"
          rm -rf "$state"
          git worktree add --detach "$state" origin/janus/activator-state
          git -C "$state" config user.name "JANUS Contextual Mind Probe R2"
          git -C "$state" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export STATE_DIR="$state/state/activator"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from janus_spi.turing_gate_arm import arm_status, consume_arm
          arm=json.loads(Path('.janus/activator/CONTEXTUAL_MIND_PROBE_R2_ARM.json').read_text())
          session=json.loads(Path(os.environ['RUNNER_TEMP']+'/prepared/session.json').read_text())
          result=json.loads(Path(os.environ['RUNNER_TEMP']+'/witness/contextual-r2-local-result.json').read_text())
          transcript=json.loads(Path(os.environ['RUNNER_TEMP']+'/witness/contextual-r2-local-transcript.json').read_text())
          before=arm_status(arm,state_dir=os.environ['STATE_DIR'])
          assert before['should_run'] is True and before['consumed'] is False
          after=consume_arm(arm,state_dir=os.environ['STATE_DIR'],session=session,result=result,transcript=transcript)
          assert after['consumed'] is True and after['should_run'] is False
          print('CONTEXTUAL_R2_ONE_SHOT_CONSUMED=PASS')
          PY
          git -C "$state" add state/activator/turing_style_gate_arm_ledger.jsonl
          git -C "$state" commit -m "JANUS contextual mind probe R2 local witness ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          git -C "$state" push origin HEAD:refs/heads/janus/activator-state
