name: JANUS Genesis Scene API CI

on:
  push:
    paths:
      - 'src/janus_spi/genesis_api.py'
      - 'src/janus_spi/genesis_scene_graph.py'
      - 'src/janus_spi/genesis_scene_graph_r04.py'
      - 'src/janus_spi/genesis_scene_graph_transport.py'
      - 'run_janus_genesis_api.py'
      - 'run_janus_genesis_scene_api.py'
      - 'tests/test_genesis_api.py'
      - 'tests/test_genesis_scene_graph.py'
      - 'spec/JANUS_GENESIS_API-v1.0.json'
      - 'spec/JANUS_GENESIS_SCENE_GRAPH-v0.4.json'
      - 'deploy/Dockerfile.genesis-scene-api'
      - '.github/workflows/janus-genesis-scene-api-ci.yml'
  pull_request:
    paths:
      - 'src/janus_spi/genesis_api.py'
      - 'src/janus_spi/genesis_scene_graph.py'
      - 'src/janus_spi/genesis_scene_graph_r04.py'
      - 'src/janus_spi/genesis_scene_graph_transport.py'
      - 'run_janus_genesis_api.py'
      - 'run_janus_genesis_scene_api.py'
      - 'tests/test_genesis_api.py'
      - 'tests/test_genesis_scene_graph.py'
      - 'spec/JANUS_GENESIS_API-v1.0.json'
      - 'spec/JANUS_GENESIS_SCENE_GRAPH-v0.4.json'
      - 'deploy/Dockerfile.genesis-scene-api'
      - '.github/workflows/janus-genesis-scene-api-ci.yml'

permissions:
  contents: read

jobs:
  scene-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile scene nerve
        run: |
          python -m compileall -q src/janus_spi/genesis_api.py src/janus_spi/genesis_scene_graph.py src/janus_spi/genesis_scene_graph_r04.py src/janus_spi/genesis_scene_graph_transport.py run_janus_genesis_api.py run_janus_genesis_scene_api.py
      - name: Validate graph contract JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('spec/JANUS_GENESIS_SCENE_GRAPH-v0.4.json').read_text(encoding='utf-8'))
          assert contract['version'] == '0.4.0'
          assert contract['limits']['max_nodes'] == 32
          assert contract['authority']['janus_graph_is_world_authority'] is False
          assert contract['deployment']['live_claim_requires_real_https_health_check'] is True
          print('SCENE_GRAPH_CONTRACT_VALID')
          PY
      - name: Adversarial scene graph tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_genesis_api.py tests/test_genesis_scene_graph.py
      - name: Build deployable persistent nerve image
        run: docker build -f deploy/Dockerfile.genesis-scene-api -t janus-genesis-scene-api:r0.4 .
      - name: Container health and graph roundtrip
        run: |
          docker run -d --rm --name janus-scene -p 18765:8080 janus-genesis-scene-api:r0.4
          cleanup() { docker stop janus-scene >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          python - <<'PY'
          import hashlib, json, time, urllib.request
          for _ in range(30):
              try:
                  health=json.load(urllib.request.urlopen('http://127.0.0.1:18765/v1/health',timeout=1))
                  if health.get('scene_graph_available') is True:
                      break
              except Exception:
                  time.sleep(.3)
          else:
              raise SystemExit('scene API health never became ready')
          payload={
              'schema':'janus.genesis.api.request.v1',
              'request_id':'ci-scene-1',
              'player_text':'построй заброшенный собор на холме, одна башня разрушена, внутри орган, у входа белые деревья',
              'canonical_world_state':{
                  'world_id':'GENESIS_ONE_WORLD_R0','world_seed':'genesis-one-world-r0','generator_version':'GENESIS_COMMAND_RUNTIME_R0.3.0',
                  'player_position':{'x':0.5,'y':0.5},'world_settings':{'time':'DAY','fog':0.08},
                  'discovered_chunk_coordinates':[[0,0]],'explicit_world_mutations':[],'chronicle_tip_hash':'GENESIS'
              }
          }
          req=urllib.request.Request('http://127.0.0.1:18765/v1/genesis/scene-graph',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
          out=json.load(urllib.request.urlopen(req,timeout=3))
          assert out['schema']=='janus.genesis.scene_graph.response.v1'
          graph=out['scene_graph']
          roots=[n for n in graph['nodes'] if n['family']=='STRUCTURE']
          assert len(roots)==1 and 'cathedral' in roots[0]['concept']
          assert graph['authority']['janus_graph_is_world_authority'] is False
          proof=out['transport_proof']
          assert hashlib.sha256(proof['canonical_graph_json'].encode('utf-8')).hexdigest()==proof['canonical_graph_utf8_sha256']
          assert json.loads(proof['canonical_graph_json'])==graph
          print('SCENE_GRAPH_CONTAINER_ROUNDTRIP_PASS', graph['graph_id'], len(graph['nodes']))
          PY
