name: JANUS-SPI CI

on:
  push:
    paths:
      - 'src/janus_spi/**'
      - 'tests/**'
      - 'config/**'
      - '.janus/activator/**'
      - 'run_janus_activator.py'
      - 'run_janus_activator_hearth.py'
      - 'run_janus_live_cycle.py'
      - 'run_janus_dispatch.py'
      - 'run_janus_transport.py'
      - 'run_janus_ack_reconcile.py'
      - 'run_janus_ack_provenance.py'
      - 'run_janus_execution_grant.py'
      - 'run_janus_execution_transport.py'
      - 'run_janus_execution_return.py'
      - 'run_janus_spi.py'
      - 'run_janus_realtime.py'
      - 'run_aura_habitat_spiral.py'
      - 'run_aura_habitat_bus.py'
      - 'requirements.txt'
      - '.github/workflows/janus-spi-ci.yml'
      - '.github/workflows/janus-activator-live-cycle.yml'
      - '.github/workflows/janus-activator-hearth.yml'
      - '.github/workflows/janus-activator-execution-grant.yml'
      - '.github/workflows/janus-activator-execution-transport.yml'
      - '.github/workflows/janus-activator-execution-return.yml'
      - '.github/workflows/janus-activator-transport.yml'
      - '.github/workflows/janus-activator-ack-reconciliation.yml'
      - '.github/workflows/janus-activator-ack-provenance.yml'
  pull_request:
    paths:
      - 'src/janus_spi/**'
      - 'tests/**'
      - 'config/**'
      - '.janus/activator/**'
      - 'run_janus_activator.py'
      - 'run_janus_activator_hearth.py'
      - 'run_janus_live_cycle.py'
      - 'run_janus_dispatch.py'
      - 'run_janus_transport.py'
      - 'run_janus_ack_reconcile.py'
      - 'run_janus_ack_provenance.py'
      - 'run_janus_execution_grant.py'
      - 'run_janus_execution_transport.py'
      - 'run_janus_execution_return.py'
      - 'run_janus_spi.py'
      - 'run_janus_realtime.py'
      - 'run_aura_habitat_spiral.py'
      - 'run_aura_habitat_bus.py'
      - 'requirements.txt'
      - '.github/workflows/janus-spi-ci.yml'
      - '.github/workflows/janus-activator-live-cycle.yml'
      - '.github/workflows/janus-activator-hearth.yml'
      - '.github/workflows/janus-activator-execution-grant.yml'
      - '.github/workflows/janus-activator-execution-transport.yml'
      - '.github/workflows/janus-activator-execution-return.yml'
      - '.github/workflows/janus-activator-transport.yml'
      - '.github/workflows/janus-activator-ack-reconciliation.yml'
      - '.github/workflows/janus-activator-ack-provenance.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q src run_janus_activator.py run_janus_activator_hearth.py run_janus_live_cycle.py run_janus_dispatch.py run_janus_transport.py run_janus_ack_reconcile.py run_janus_ack_provenance.py run_janus_execution_grant.py run_janus_execution_transport.py run_janus_execution_return.py run_janus_spi.py run_janus_realtime.py run_aura_habitat_spiral.py run_aura_habitat_bus.py
      - name: Validate Activator JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path('.janus/activator').glob('*.json')):
              json.loads(p.read_text(encoding='utf-8'))
              print('VALID_JSON', p)
          json.loads(Path('config/constellation.json').read_text(encoding='utf-8'))
          json.loads(Path('config/JANUS_INTELLIGENCE_STEP_POLICY-v1.0.json').read_text(encoding='utf-8'))
          PY
      - name: Test
        env:
          PYTHONPATH: src
        run: pytest -q
