name: JANUS-SPI CI

on:
  push:
    paths:
      - 'src/janus_spi/**'
      - 'tests/**'
      - 'run_janus_spi.py'
      - 'run_janus_realtime.py'
      - 'run_aura_habitat_spiral.py'
      - 'run_aura_habitat_bus.py'
      - 'requirements.txt'
      - '.github/workflows/janus-spi-ci.yml'
  pull_request:
    paths:
      - 'src/janus_spi/**'
      - 'tests/**'
      - 'run_janus_spi.py'
      - 'run_janus_realtime.py'
      - 'run_aura_habitat_spiral.py'
      - 'run_aura_habitat_bus.py'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q src run_janus_spi.py run_janus_realtime.py run_aura_habitat_spiral.py run_aura_habitat_bus.py
      - name: Test
        run: pytest -q
