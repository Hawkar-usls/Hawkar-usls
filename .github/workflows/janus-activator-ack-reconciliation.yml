name: JANUS Activator ACK Reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/janus_spi/ack.py'
      - 'run_janus_ack_reconcile.py'
      - 'tests/test_ack_reconciliation.py'
      - '.janus/activator/ACK_RECONCILIATION_CONSTITUTION.json'
      - '.janus/activator/ACK_RECONCILIATION_RECEIPT.schema.json'
      - '.github/workflows/janus-activator-ack-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'src/janus_spi/ack.py'
      - 'run_janus_ack_reconcile.py'
      - 'tests/test_ack_reconciliation.py'
      - '.janus/activator/ACK_RECONCILIATION_CONSTITUTION.json'
      - '.janus/activator/ACK_RECONCILIATION_RECEIPT.schema.json'
      - '.github/workflows/janus-activator-ack-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile ACK runtime and tests
        run: python -m compileall -q src/janus_spi/ack.py run_janus_ack_reconcile.py tests/test_ack_reconciliation.py
      - name: Validate ACK contracts
        run: |
          python - <<'PY'
          import json
          for p in [
              '.janus/activator/ACK_RECONCILIATION_CONSTITUTION.json',
              '.janus/activator/ACK_RECONCILIATION_RECEIPT.schema.json',
          ]:
              json.load(open(p, encoding='utf-8'))
              print('VALID_JSON', p)
          PY
      - name: Test ACK reconciliation
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_ack_reconciliation.py
