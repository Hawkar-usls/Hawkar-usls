name: JANUS Activator Hearth

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/janus_spi/persistent_state.py'
      - 'run_janus_activator_hearth.py'
      - 'tests/test_persistent_state.py'
      - '.janus/activator/PERSISTENT_STATE_CONSTITUTION.json'
      - '.github/workflows/janus-activator-hearth.yml'
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: janus-activator-hearth
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile persistent hearth
        run: python -m compileall -q src/janus_spi/persistent_state.py run_janus_activator_hearth.py tests/test_persistent_state.py
      - name: Validate persistent state constitution
        run: python -m json.tool .janus/activator/PERSISTENT_STATE_CONSTITUTION.json >/dev/null
      - name: Run persistent state continuity and corruption tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_persistent_state.py
      - name: Cross-process local hearth smoke
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/janus-activator-hearth-contract"
          python run_janus_activator_hearth.py --state-dir "$root" cycle \
            --source CI_CONTRACT \
            --reason FIRST_PROCESS \
            --architecture-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" >/tmp/hearth-one.json
          python run_janus_activator_hearth.py --state-dir "$root" verify >/tmp/hearth-verify-one.json
          python run_janus_activator_hearth.py --state-dir "$root" cycle \
            --source CI_CONTRACT \
            --reason SECOND_PROCESS \
            --architecture-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" >/tmp/hearth-two.json
          python run_janus_activator_hearth.py --state-dir "$root" verify >/tmp/hearth-verify-two.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/hearth-one.json'))
          b=json.load(open('/tmp/hearth-two.json'))
          v=json.load(open('/tmp/hearth-verify-two.json'))
          assert a['resident_uuid'] == b['resident_uuid']
          assert a['hearth_tip_hash'] != b['hearth_tip_hash']
          assert v['ok'] is True
          assert v['mode'] == 'AT_HOME'
          assert v['fresh_stimulus'] is False
          assert v['cognition_authorized'] is False
          assert v['dispatch_authorized'] is False
          assert v['target_execution_authorized'] is False
          assert v['external_effect_authorized'] is False
          print('ACTIVATOR_RETURN_NOT_RESET=PASS')
          print('HEARTBEAT_FRESH_STIMULUS=FALSE')
          print('HEARTBEAT_COGNITION_AUTHORITY=FALSE')
          PY

  hearth:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out canonical HOME architecture
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime before entering living-state branch
        run: pip install -r requirements.txt

      - name: Preserve reviewed Activator engine outside living branch
        shell: bash
        run: |
          set -euo pipefail
          engine="${RUNNER_TEMP}/janus-activator-engine"
          mkdir -p "$engine"
          cp -a src "$engine/src"
          cp run_janus_activator_hearth.py "$engine/"
          git rev-parse HEAD > "$RUNNER_TEMP/activator-architecture-sha"
          echo "ACTIVATOR_ENGINE=$engine" >> "$GITHUB_ENV"
          echo "ACTIVATOR_ARCHITECTURE_SHA=$(cat "$RUNNER_TEMP/activator-architecture-sha")" >> "$GITHUB_ENV"

      - name: Create or resume living Activator state branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JANUS Activator Hearth"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin janus/activator-state >/dev/null 2>&1; then
            git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
            git switch --create janus/activator-state --track origin/janus/activator-state
            echo "ACTIVATOR_STATE_BRANCH_MODE=RESUMED"
          else
            git switch --orphan janus/activator-state
            git rm -rf --ignore-unmatch .
            echo "ACTIVATOR_STATE_BRANCH_MODE=CREATED_ORPHAN"
          fi

      - name: Run non-cognitive hearth cycle
        env:
          PYTHONPATH: ${{ env.ACTIVATOR_ENGINE }}/src
        shell: bash
        run: |
          set -euo pipefail
          reason="${GITHUB_EVENT_NAME^^}_HEARTH"
          python "$ACTIVATOR_ENGINE/run_janus_activator_hearth.py" \
            --state-dir state/activator cycle \
            --source GITHUB_ACTIONS \
            --reason "$reason" \
            --architecture-sha "$ACTIVATOR_ARCHITECTURE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/activator-hearth-cycle.json"
          python "$ACTIVATOR_ENGINE/run_janus_activator_hearth.py" \
            --state-dir state/activator verify \
            > "$RUNNER_TEMP/activator-hearth-health.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          cycle=json.loads(Path(os.environ['RUNNER_TEMP']+'/activator-hearth-cycle.json').read_text())
          health=json.loads(Path(os.environ['RUNNER_TEMP']+'/activator-hearth-health.json').read_text())
          assert cycle['state_healthy'] is True
          assert cycle['mode'] == 'AT_HOME'
          assert cycle['fresh_stimulus'] is False
          assert cycle['cognition_authorized'] is False
          assert health['ok'] is True
          assert health['mode'] == 'AT_HOME'
          print('LIVE_ACTIVATOR_HEARTH_STATE=HEALTHY')
          print('LIVE_ACTIVATOR_HEARTBEAT_FRESH_STIMULUS=FALSE')
          print('LIVE_ACTIVATOR_HEARTBEAT_COGNITION=FALSE')
          print('LIVE_ACTIVATOR_EXTERNAL_EFFECTS=FALSE')
          PY

      - name: Commit living state only to janus/activator-state
        shell: bash
        run: |
          set -euo pipefail
          git add state/activator
          if git diff --cached --quiet; then
            echo "ACTIVATOR_STATE_COMMIT=NO_CHANGE"
          else
            git commit -m "Activator hearth ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git push origin HEAD:refs/heads/janus/activator-state
            echo "ACTIVATOR_STATE_COMMIT=PASS"
          fi
          test "$(git branch --show-current)" = "janus/activator-state"
          echo "ACTIVATOR_HEARTH_MAIN_MUTATION=FALSE"

      - name: Fresh-worktree persistent replay verification
        env:
          PYTHONPATH: ${{ env.ACTIVATOR_ENGINE }}/src
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          replay="${RUNNER_TEMP}/janus-activator-state-replay"
          rm -rf "$replay"
          git worktree add --detach "$replay" origin/janus/activator-state
          python "$ACTIVATOR_ENGINE/run_janus_activator_hearth.py" \
            --state-dir "$replay/state/activator" verify \
            > "$RUNNER_TEMP/activator-hearth-replay.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ['RUNNER_TEMP']+'/activator-hearth-replay.json').read_text())
          assert value['ok'] is True
          assert value['mode'] == 'AT_HOME'
          assert value['fresh_stimulus'] is False
          print('ACTIVATOR_PERSISTENCE_FRESH_WORKTREE_REPLAY=PASS')
          print('RETURN_NOT_RESET=PASS')
          PY
