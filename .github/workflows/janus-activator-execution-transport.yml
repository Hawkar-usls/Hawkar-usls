name: JANUS Activator Execution Transport

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/janus_spi/execution_transport.py'
      - 'run_janus_execution_transport.py'
      - 'tests/test_execution_return.py'
      - '.janus/activator/EXECUTION_RETURN_CONSTITUTION.json'
      - '.github/workflows/janus-activator-execution-transport.yml'
  push:
    branches: [main]
    paths:
      - 'src/janus_spi/execution_transport.py'
      - 'run_janus_execution_transport.py'
      - 'tests/test_execution_return.py'
      - '.janus/activator/EXECUTION_RETURN_CONSTITUTION.json'
      - '.github/workflows/janus-activator-execution-transport.yml'
  workflow_dispatch:
    inputs:
      grant_hash:
        description: 'Exact grant_hash from persistent execution_grant_ledger'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: janus-activator-execution-transport
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile and validate
        run: |
          python -m compileall -q src/janus_spi/execution_transport.py run_janus_execution_transport.py tests/test_execution_return.py
          python -m json.tool .janus/activator/EXECUTION_RETURN_CONSTITUTION.json >/dev/null
      - name: Run execution transport/return contract tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_execution_return.py

  send:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out reviewed HOME architecture
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve reviewed engine and enter persistent HOME state
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          engine="${RUNNER_TEMP}/janus-execution-transport-engine"
          mkdir -p "$engine"
          cp -a src "$engine/src"
          cp run_janus_execution_transport.py "$engine/"
          cp run_janus_activator_hearth.py "$engine/"
          echo "JANUS_ENGINE=$engine" >> "$GITHUB_ENV"
          git config user.name "JANUS Execution Transport"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          git switch --create janus/activator-state --track origin/janus/activator-state
      - name: Verify persistent HOME before execution transport
        env:
          PYTHONPATH: ${{ env.JANUS_ENGINE }}/src
        run: python "$JANUS_ENGINE/run_janus_activator_hearth.py" --state-dir state/activator verify > "$RUNNER_TEMP/pre-health.json"
      - name: Resolve exact persistent execution grant
        env:
          GRANT_HASH: ${{ inputs.grant_hash }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          wanted=os.environ['GRANT_HASH'].strip()
          if len(wanted) != 64:
              raise SystemExit('GRANT_HASH_MUST_BE_64_HEX')
          path=Path('state/activator/execution_grant_ledger.jsonl')
          if not path.is_file():
              raise SystemExit('NO_PERSISTENT_EXECUTION_GRANT_LEDGER')
          rows=[json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          matches=[row for row in rows if row.get('grant_hash') == wanted and row.get('target_execution_authorized') is True]
          if len(matches) != 1:
              raise SystemExit(f'EXACT_EXECUTION_GRANT_MATCH_COUNT={len(matches)}')
          out=Path(os.environ['RUNNER_TEMP'])/'execution-grant.json'
          out.write_text(json.dumps(matches[0], ensure_ascii=False, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print('EXACT_PERSISTENT_EXECUTION_GRANT=PASS')
          PY
      - name: Submit bounded execution grant
        id: submit
        env:
          PYTHONPATH: ${{ env.JANUS_ENGINE }}/src
          JANUS_DEMIURGE_DISPATCH_TOKEN: ${{ secrets.JANUS_DEMIURGE_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$JANUS_ENGINE/run_janus_execution_transport.py" \
            --grant "$RUNNER_TEMP/execution-grant.json" \
            --state-dir state/activator \
            --output "$RUNNER_TEMP/execution-transport.json"
          terminal=$(python -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/execution-transport.json'))['terminal'])")
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          echo "EXECUTION_TRANSPORT_TERMINAL=$terminal"
      - name: Verify and persist transport lineage before verdict
        env:
          PYTHONPATH: ${{ env.JANUS_ENGINE }}/src
        shell: bash
        run: |
          set -euo pipefail
          python "$JANUS_ENGINE/run_janus_activator_hearth.py" --state-dir state/activator verify > "$RUNNER_TEMP/post-health.json"
          git add state/activator/execution_transport_ledger.jsonl state/activator/health.json
          if ! git diff --cached --quiet; then
            git commit -m "Execution transport ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git push origin HEAD:refs/heads/janus/activator-state
          fi
          echo "EXECUTION_TRANSPORT_STATE_PERSISTED=TRUE"
          echo "MAIN_MUTATION=FALSE"
      - name: Fresh-worktree replay
        env:
          PYTHONPATH: ${{ env.JANUS_ENGINE }}/src
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/activator-state:refs/remotes/origin/janus/activator-state
          replay="${RUNNER_TEMP}/execution-transport-replay"
          git worktree add --detach "$replay" origin/janus/activator-state
          python "$JANUS_ENGINE/run_janus_activator_hearth.py" --state-dir "$replay/state/activator" verify >/dev/null
          echo "EXECUTION_TRANSPORT_PERSISTENT_REPLAY=PASS"
      - name: Require submitted transport
        env:
          TERMINAL: ${{ steps.submit.outputs.terminal }}
        run: |
          test "$TERMINAL" = "EXECUTION_TRANSPORT_SENT_AWAITING_RESULT"
          echo "EXECUTION_GRANT_TRANSPORT=SUBMITTED"
          echo "TARGET_EXECUTION_OBSERVED=FALSE"
