name: JANUS Activator Transport

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/janus_spi/transport.py'
      - 'run_janus_transport.py'
      - 'tests/test_transport.py'
      - '.janus/activator/TRANSPORT_CONSTITUTION.json'
      - '.janus/activator/TRANSPORT_RECEIPT.schema.json'
      - '.github/workflows/janus-activator-transport.yml'
  push:
    branches: [main]
    paths:
      - 'src/janus_spi/transport.py'
      - 'run_janus_transport.py'
      - 'tests/test_transport.py'
      - '.janus/activator/TRANSPORT_CONSTITUTION.json'
      - '.janus/activator/TRANSPORT_RECEIPT.schema.json'
      - '.github/workflows/janus-activator-transport.yml'
  workflow_dispatch:
    inputs:
      packet_json:
        description: 'Sealed janus.activator.dispatch_packet.v0.3 JSON targeted to Janus-Demiurge'
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile transport runtime and tests
        run: python -m compileall -q src/janus_spi/transport.py run_janus_transport.py tests/test_transport.py
      - name: Validate transport contracts
        run: |
          python - <<'PY'
          import json
          for p in [
              '.janus/activator/TRANSPORT_CONSTITUTION.json',
              '.janus/activator/TRANSPORT_RECEIPT.schema.json',
          ]:
              json.load(open(p, encoding='utf-8'))
              print('VALID_JSON', p)
          PY
      - name: Test transport
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_transport.py

  send:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize packet
        env:
          PACKET_JSON: ${{ inputs.packet_json }}
        run: |
          mkdir -p runtime/activator-transport
          printf '%s' "$PACKET_JSON" > runtime/activator-transport/packet.json
          python -m json.tool runtime/activator-transport/packet.json >/dev/null
      - name: Send to admitted internal receiver
        env:
          JANUS_DEMIURGE_DISPATCH_TOKEN: ${{ secrets.JANUS_DEMIURGE_DISPATCH_TOKEN }}
        run: |
          python run_janus_transport.py \
            --packet runtime/activator-transport/packet.json \
            --state-dir runtime/activator-transport/state \
            --output runtime/activator-transport/transport-receipt.json \
            --require-sent
      - name: Upload sender receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-activator-transport-receipt-${{ github.run_id }}
          path: runtime/activator-transport/transport-receipt.json
          if-no-files-found: warn
          retention-days: 14
