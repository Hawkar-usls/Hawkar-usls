services:
  janus-aura-spi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.aura-spi
    restart: unless-stopped
    command:
      - python
      - run_aura_habitat_bus.py
      - --habitat-root
      - /habitat
      - --state-dir
      - /state
      - --aura-peer
      - python /aura/tools/aura_habitat_spiral_peer_v1.py
      - --interval
      - "5"
      - --demihead-decision
      - HOLD
    volumes:
      - ../state:/state
      - ../../Janus_Genesis/habitat:/habitat
      - ../../aura-oracle-tg:/aura:ro
    environment:
      PYTHONUNBUFFERED: "1"
    read_only: false
    security_opt:
      - no-new-privileges:true

# Expected sibling checkout layout:
#   Hawkar-usls/Hawkar-usls
#   Hawkar-usls/Janus_Genesis
#   Hawkar-usls/aura-oracle-tg
#
# This service does not push GitHub and does not grant external-effect authority.
# DemiHead decision defaults to HOLD until an explicit verified arbiter adapter is supplied.
